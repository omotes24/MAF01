dataset:
  source_url: https://drive.google.com/drive/folders/1LCdZnAN6gWIv_Ds0bTWLipD6jjptLAgj?usp=sharing
  root: /home/omote/WILD_DATA/splits
  id_classes: [buffalo, cheetah, elephant, giraffe, hippo]
  ood_classes: [impala, leopard, lion, rhino, wildebeest]
  use_val_ood: false

backbone:
  name: dinov2_vitb14
  feature_dim: 768
  input_size: 224
  resize: 256
  crop: center
  normalization: imagenet
  frozen: true
  fine_tuning: false

maf:
  feature_space: raw
  covariance: tied
  estimator: ledoit_wolf
  alpha: 0.50
  tau: 1.0
  epsilon: 1.0e-12
  alpha_source: fixed_after_exploratory_ablation
  oracle_ood_tuning: false

evaluation:
  id_split: test/id
  ood_split: test/ood
  metrics: [AUROC, AUPR-IN, AUPR-OUT, FPR95, AUTC]
