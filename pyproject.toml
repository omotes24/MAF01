[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maf01"
version = "0.1.0"
description = "Mahalanobis Affinity Fusion for wildlife Near-OOD detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pillow>=10.0",
  "tqdm>=4.66",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
vision = [
  "torch>=2.0",
  "torchvision>=0.15",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
